apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
spec:
  workspaces:
    - name: output
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: output

    - name: git-clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: https://github.com/ABDELRAHIM4/ci-cd-final-project.git
        - name: revision
          value: main
      workspaces:
        - name: output
          workspace: output
      runAfter:
        - cleanup

    - name: flake8
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: output
      runAfter:
        - git-clone

    - name: nose
      taskRef:
        name: nose
      params:
        - name: args
          value: "-v"
      workspaces:
        - name: source
          workspace: output
      runAfter:
        - flake8

    - name: buildah
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/sn-labs-abdulrhimsae/ci-cd-final-project:latest
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: output
      runAfter:
        - nose

    - name: deploy
      taskRef:
        name: openshift-client
      params:
        - name: SCRIPT
          value: |
            oc create deployment ci-cd-final-project --image=image-registry.openshift-image-registry.svc:5000/sn-labs-abdulrhimsae/ci-cd-final-project:latest --dry-run=client -o yaml | oc apply -f -
      runAfter:
        - buildah
